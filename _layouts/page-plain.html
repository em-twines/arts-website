---
layout: default
---

<!-- Page Header -->
<header class="intro-header" style="background-image: none; background-color: #fff; min-height: 80px;">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
                <div class="site-heading" style="padding: 70px 0 30px;">
                    <h1 style="color: #000; font-size: 28px; text-shadow: none;">{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</h1>
                    <hr class="small" style="border-color: #000;">
                    <span class="subheading" style="color: #333; font-size: 16px; text-shadow: none;">{{ page.description }}</span>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="container">
	<div class="row">
				{{ content }}
	</div>
</div>

<!-- jQuery -->

<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<!-- Custom Theme JavaScript -->
<script src="{{ site.baseurl }}/js/main.min.js "></script>
